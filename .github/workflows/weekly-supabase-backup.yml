name: Weekly private Supabase backup

on:
  schedule:
    # Every Sunday at 20:00 UTC (Monday 01:30 India time)
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: divine-school-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref dazrkmpnqrfrofilbeca

      - name: Export database schema, data and roles
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backup/database backup/storage
          supabase db dump --remote="$SUPABASE_DB_URL" -f backup/database/schema.sql
          supabase db dump --remote="$SUPABASE_DB_URL" -f backup/database/data.sql --data-only --use-copy -x "storage.buckets_vectors" -x "storage.vector_indexes"
          supabase db dump --remote="$SUPABASE_DB_URL" -f backup/database/roles.sql --role-only
          supabase db dump --remote="$SUPABASE_DB_URL" -f backup/database/roles.sql --role-only

      - name: Download school-media storage objects
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          mkdir -p backup/storage/school-media
          supabase storage cp ss:///school-media backup/storage/school-media --recursive --experimental --remote

      - name: Configure private Google Drive remote
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone listremotes | grep -qx 'schooldrive:'

      - name: Upload backup to private Google Drive
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          tar -czf "divine-school-backup-$DATE.tar.gz" backup
          rclone copy "divine-school-backup-$DATE.tar.gz" "schooldrive:DivinePublicSchoolBackups/$DATE/"
          rclone delete "schooldrive:DivinePublicSchoolBackups" --min-age 90d || true
          rclone rmdirs "schooldrive:DivinePublicSchoolBackups" --leave-root || true

      - name: Remove temporary backup files
        if: always()
        run: rm -rf backup divine-school-backup-*.tar.gz
