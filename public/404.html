<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found (404) | Divine Public School</title>
    <meta name="description" content="The page you requested could not be found on the Divine Public School website." />
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/png" href="/DivinePublicSchool/favicon.png" />
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f9fd;
        font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#12295c;padding:1.5rem}
      .box{max-width:34rem;text-align:center}
      h1{font-size:clamp(1.5rem,4vw,2.1rem);margin:0 0 .6rem}
      p{color:#4a5a7a;line-height:1.65;margin:0 0 1.4rem}
      a.btn{display:inline-block;background:#12295c;color:#fff;text-decoration:none;
        padding:.8rem 1.5rem;border-radius:999px;font-weight:600}
    </style>
    <script>
      // Known deep paths bounce into the matching hash route of the SPA.
      (function () {
        var base = '/DivinePublicSchool/'
        var path = location.pathname.indexOf(base) === 0 ? location.pathname.slice(base.length) : ''
        var slug = path.replace(/^\/+|\/+$/g, '').split('/')[0]
        var known = ["about","admissions","curriculum","timetable","date-sheets","gallery","contact","mandatory-disclosure"]
        var routes = {"about":"/about","admissions":"/admissions","curriculum":"/curriculum","timetable":"/curriculum?tab=timetable","date-sheets":"/curriculum?tab=datesheet","gallery":"/gallery","contact":"/contact","mandatory-disclosure":"/mandatory-disclosure"}
        if (slug && known.indexOf(slug) !== -1) location.replace(base + '#' + routes[slug])
      })()
    </script>
  </head>
  <body>
    <div class="box">
      <h1>This page could not be found</h1>
      <p>
        The address you entered does not exist on the Divine Public School website.
        It may have been moved, or the link may be incomplete.
      </p>
      <a class="btn" href="/DivinePublicSchool/">Go to the homepage</a>
    </div>
  </body>
</html>
